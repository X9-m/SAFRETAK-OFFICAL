name: One-time legacy UI purge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ui-legacy-purge.yml

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Consolidate styles and remove legacy palette
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          import colorsys
          import re
          from pathlib import Path

          root = Path('.')
          src = root / 'src'

          layout_sources = [
              src / 'index.css',
              src / 'role-portal.css',
              src / 'smart-features.css',
              src / 'business-portals.css',
          ]
          missing = [str(path) for path in layout_sources if not path.exists()]
          if missing:
              raise SystemExit(f'Missing layout files: {missing}')

          layout_parts = [
              '/* SAFRETAK structural layout only. Visual tokens live in design-system.css. */'
          ]
          for path in layout_sources:
              layout_parts.append(f'\n/* Source section: {path.name} */\n{path.read_text(encoding="utf-8").strip()}')
          (src / 'layout.css').write_text('\n'.join(layout_parts).strip() + '\n', encoding='utf-8')

          theme_source = src / 'app-theme.css'
          if not theme_source.exists():
              raise SystemExit('src/app-theme.css is missing')
          (src / 'design-system.css').write_text(
              '/* SAFRETAK unified blue-and-white design system. */\n' + theme_source.read_text(encoding='utf-8').strip() + '\n',
              encoding='utf-8',
          )

          main_path = src / 'main.tsx'
          main = main_path.read_text(encoding='utf-8')
          old_imports = """import './index.css';
          import './role-portal.css';
          import './smart-features.css';
          import './business-portals.css';
          import './app-theme.css';"""
          new_imports = """import './layout.css';
          import './design-system.css';"""
          if old_imports not in main:
              raise SystemExit('Expected legacy style imports were not found in src/main.tsx')
          main_path.write_text(main.replace(old_imports, new_imports), encoding='utf-8')

          for path in [*layout_sources, theme_source]:
              path.unlink()

          text_targets: list[Path] = []
          for base in [src, root / 'public']:
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if path.is_file() and path.suffix.lower() in {'.css', '.ts', '.tsx', '.svg', '.html'}:
                      text_targets.append(path)
          if (root / 'index.html').exists():
              text_targets.append(root / 'index.html')

          variable_replacements = {
              'var(--gold-soft)': 'var(--brand-dark)',
              'var(--gold)': 'var(--brand)',
              'var(--bg)': 'var(--surface-soft)',
              'var(--panel-2)': 'var(--brand-pale)',
              'var(--panel)': 'var(--surface)',
              'var(--text)': 'var(--ink)',
          }

          named_color_replacements = {
              'gold': '#0b6ee8',
              'goldenrod': '#0b6ee8',
              'darkgoldenrod': '#0656c8',
              'green': '#0b6ee8',
              'darkgreen': '#082a68',
              'lightgreen': '#eaf3ff',
              'lime': '#0b6ee8',
              'limegreen': '#0b6ee8',
              'olive': '#405474',
              'yellow': '#79b8ff',
              'chartreuse': '#0b6ee8',
          }

          def is_legacy_hue(red: int, green: int, blue: int) -> bool:
              hue, saturation, _ = colorsys.rgb_to_hsv(red / 255, green / 255, blue / 255)
              degrees = hue * 360
              return saturation >= 0.18 and 30 <= degrees <= 170

          def blue_for(red: int, green: int, blue: int) -> tuple[int, int, int]:
              _, _, value = colorsys.rgb_to_hsv(red / 255, green / 255, blue / 255)
              if value < 0.27:
                  return (8, 42, 104)
              if value < 0.58:
                  return (11, 110, 232)
              if value < 0.84:
                  return (121, 184, 255)
              return (234, 243, 255)

          hex_pattern = re.compile(r'(?<![A-Za-z0-9])#([0-9a-fA-F]{3}|[0-9a-fA-F]{4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})(?![0-9a-fA-F])')
          rgb_pattern = re.compile(
              r'rgba?\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})(\s*,\s*[^\)]+)?\)',
              re.IGNORECASE,
          )
          hsl_pattern = re.compile(r'hsla?\(\s*(-?\d+(?:\.\d+)?)', re.IGNORECASE)

          def replace_hex(match: re.Match[str]) -> str:
              raw = match.group(1)
              if len(raw) in {3, 4}:
                  expanded = ''.join(char * 2 for char in raw)
              else:
                  expanded = raw
              red, green, blue = (int(expanded[index:index + 2], 16) for index in (0, 2, 4))
              if not is_legacy_hue(red, green, blue):
                  return match.group(0)
              next_red, next_green, next_blue = blue_for(red, green, blue)
              alpha = expanded[6:8] if len(expanded) == 8 else ''
              return f'#{next_red:02x}{next_green:02x}{next_blue:02x}{alpha}'

          def replace_rgb(match: re.Match[str]) -> str:
              red, green, blue = (min(255, int(match.group(index))) for index in (1, 2, 3))
              if not is_legacy_hue(red, green, blue):
                  return match.group(0)
              next_red, next_green, next_blue = blue_for(red, green, blue)
              alpha = match.group(4) or ''
              function_name = 'rgba' if alpha else 'rgb'
              return f'{function_name}({next_red}, {next_green}, {next_blue}{alpha})'

          def replace_hsl(match: re.Match[str]) -> str:
              hue = float(match.group(1)) % 360
              if 30 <= hue <= 170:
                  return match.group(0).replace(match.group(1), '212', 1)
              return match.group(0)

          changed: list[str] = []
          for path in sorted(set(text_targets)):
              original = path.read_text(encoding='utf-8')
              text = original.replace('gold-button', 'primary-button')
              for old, new in variable_replacements.items():
                  text = text.replace(old, new)

              text = re.sub(
                  r'^\s*--(?:gold(?:-soft)?|bg|panel(?:-2)?|text)\s*:[^;]+;\s*$',
                  '',
                  text,
                  flags=re.MULTILINE,
              )

              for name, replacement in named_color_replacements.items():
                  text = re.sub(
                      rf'(?i)(?<=[:\s,(]){re.escape(name)}(?=\s*[;),])',
                      replacement,
                      text,
                  )

              text = hex_pattern.sub(replace_hex, text)
              text = rgb_pattern.sub(replace_rgb, text)
              text = hsl_pattern.sub(replace_hsl, text)

              lines = text.splitlines()
              normalized: list[str] = []
              for line in lines:
                  if normalized and line.strip() == '.primary-button,' and normalized[-1].strip() == '.primary-button,':
                      continue
                  normalized.append(line.rstrip())
              text = '\n'.join(normalized).strip() + '\n'

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          forbidden_text = re.compile(r'gold-button|--gold(?:-soft)?\b', re.IGNORECASE)
          color_issues: list[str] = []
          naming_issues: list[str] = []

          for path in sorted(set(text_targets)):
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if forbidden_text.search(text):
                  naming_issues.append(str(path))

              for match in hex_pattern.finditer(text):
                  raw = match.group(1)
                  expanded = ''.join(char * 2 for char in raw) if len(raw) in {3, 4} else raw
                  red, green, blue = (int(expanded[index:index + 2], 16) for index in (0, 2, 4))
                  if is_legacy_hue(red, green, blue):
                      color_issues.append(f'{path}: {match.group(0)}')

              for match in rgb_pattern.finditer(text):
                  red, green, blue = (min(255, int(match.group(index))) for index in (1, 2, 3))
                  if is_legacy_hue(red, green, blue):
                      color_issues.append(f'{path}: {match.group(0)}')

              for match in hsl_pattern.finditer(text):
                  hue = float(match.group(1)) % 360
                  if 30 <= hue <= 170:
                      color_issues.append(f'{path}: {match.group(0)}')

          if naming_issues or color_issues:
              print('Legacy naming issues:', naming_issues)
              print('Legacy hue issues:', color_issues[:100])
              raise SystemExit('Legacy green/gold interface artifacts remain after codemod')

          print(f'Updated {len(changed)} interface files')
          for path in changed:
              print(f' - {path}')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: npm run check

      - name: Commit cleaned interface
        shell: bash
        run: |
          rm -f .github/workflows/ui-legacy-purge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: purge legacy green and gold interface system"
          git push origin main
