name: One-time legacy UI purge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  purge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Purge legacy interface system
        run: python scripts/purge-legacy-ui.py

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: npm run check

      - name: Commit validated cleanup to pull request
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          rm -f .github/workflows/ui-legacy-purge.yml
          rm -f scripts/purge-legacy-ui.py
          rm -f .ui-purge-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: purge legacy green and gold interface system"
          git push origin HEAD:"$HEAD_BRANCH"
