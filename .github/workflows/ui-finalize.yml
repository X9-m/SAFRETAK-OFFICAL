name: Finalize unified interface cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove temporary assets and legacy labels
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          import colorsys
          import re
          from pathlib import Path

          root = Path('.')
          generated_images = [
              'public/media/ad-jordan.jpg',
              'public/media/office-dallas-cover.jpg',
              'public/media/office-plaza-cover.jpg',
              'public/media/service-bus.jpg',
              'public/media/service-car.jpg',
              'public/media/service-consultation.jpg',
              'public/media/service-dead-sea.jpg',
              'public/media/service-flight.jpg',
              'public/media/service-jordan-tour.jpg',
              'public/media/service-petra-gallery-1.jpg',
              'public/media/service-petra-gallery-2.jpg',
              'public/media/service-petra.jpg',
              'public/media/service-umrah.jpg',
              'public/media/service-visa.jpg',
          ]
          for item in generated_images:
              path = root / item
              if path.exists():
                  path.unlink()

          layout_path = root / 'src/layout.css'
          layout = layout_path.read_text(encoding='utf-8')
          section_names = {
              '/* Source section: index.css */': '/* Core application layout */',
              '/* Source section: role-portal.css */': '/* Office and administration layout */',
              '/* Source section: smart-features.css */': '/* Smart search and booking feature layout */',
              '/* Source section: business-portals.css */': '/* CRM, accounting, and billing layout */',
          }
          for old, new in section_names.items():
              layout = layout.replace(old, new)
          layout_path.write_text(layout.strip() + '\n', encoding='utf-8')

          design_path = root / 'src/design-system.css'
          design = design_path.read_text(encoding='utf-8')
          design = re.sub(
              r'\n\s*/\* Compatibility aliases for structural styles\. \*/\s*\n+',
              '\n',
              design,
              count=1,
          )
          design = design.replace(
              '.primary-button:hover:not(:disabled),\n.primary-button:hover:not(:disabled),',
              '.primary-button:hover:not(:disabled),',
          )
          design_path.write_text(design.strip() + '\n', encoding='utf-8')

          forbidden_terms = re.compile(
              r'gold-button|--gold(?:-soft)?\b|system-theme\.css|app-theme\.css|role-portal\.css|smart-features\.css|business-portals\.css',
              re.IGNORECASE,
          )
          hex_pattern = re.compile(r'(?<![A-Za-z0-9])#([0-9a-fA-F]{3}|[0-9a-fA-F]{4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})(?![0-9a-fA-F])')
          rgb_pattern = re.compile(r'rgba?\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})(?:\s*,\s*[^\)]+)?\)', re.IGNORECASE)
          hsl_pattern = re.compile(r'hsla?\(\s*(-?\d+(?:\.\d+)?)', re.IGNORECASE)
          named_pattern = re.compile(r'(?i)(?<=[:\s,(=\"\'])\b(?:gold|goldenrod|darkgoldenrod|green|darkgreen|lightgreen|lime|limegreen|olive|yellow|chartreuse)\b(?=\s*[;),\"\'])')

          def legacy_hue(red: int, green: int, blue: int) -> bool:
              hue, saturation, _ = colorsys.rgb_to_hsv(red / 255, green / 255, blue / 255)
              return saturation >= 0.18 and 30 <= hue * 360 <= 170

          issues: list[str] = []
          for base in [root / 'src', root / 'public']:
              for path in base.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.css', '.ts', '.tsx', '.svg', '.html'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  relative = path.as_posix()
                  if forbidden_terms.search(text):
                      issues.append(f'{relative}: legacy identifier')
                  if named_pattern.search(text):
                      issues.append(f'{relative}: named legacy color')
                  for match in hex_pattern.finditer(text):
                      raw = match.group(1)
                      expanded = ''.join(char * 2 for char in raw) if len(raw) in {3, 4} else raw
                      red, green, blue = (int(expanded[index:index + 2], 16) for index in (0, 2, 4))
                      if legacy_hue(red, green, blue):
                          issues.append(f'{relative}: {match.group(0)}')
                  for match in rgb_pattern.finditer(text):
                      red, green, blue = (min(255, int(match.group(index))) for index in (1, 2, 3))
                      if legacy_hue(red, green, blue):
                          issues.append(f'{relative}: {match.group(0)}')
                  for match in hsl_pattern.finditer(text):
                      hue = float(match.group(1)) % 360
                      if 30 <= hue <= 170:
                          issues.append(f'{relative}: {match.group(0)}')

          if issues:
              print('\n'.join(issues[:150]))
              raise SystemExit('Legacy interface artifacts remain')
          PY

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Application tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Remove build-generated source assets
        shell: bash
        run: |
          rm -f \
            public/media/ad-jordan.jpg \
            public/media/office-dallas-cover.jpg \
            public/media/office-plaza-cover.jpg \
            public/media/service-bus.jpg \
            public/media/service-car.jpg \
            public/media/service-consultation.jpg \
            public/media/service-dead-sea.jpg \
            public/media/service-flight.jpg \
            public/media/service-jordan-tour.jpg \
            public/media/service-petra-gallery-1.jpg \
            public/media/service-petra-gallery-2.jpg \
            public/media/service-petra.jpg \
            public/media/service-umrah.jpg \
            public/media/service-visa.jpg

      - name: Commit final cleanup to pull request
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          rm -f .github/workflows/ui-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "cleanup: finalize unified blue interface system"
          git push origin HEAD:"$HEAD_BRANCH"
